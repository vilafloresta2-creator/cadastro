<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Associados</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}

body{margin:0;background:#eef2f7}

/* LAYOUT */
.app{display:flex}

/* SIDEBAR */
.sidebar{
  width:70px;
  background:#1e293b;
  color:#fff;
  height:100vh;
  transition:.3s;
  overflow:hidden;
}
.sidebar:hover{width:200px}

.menu-item{
  padding:15px;
  cursor:pointer;
  display:flex;
  gap:10px;
}
.menu-item span{opacity:0;transition:.3s}
.sidebar:hover span{opacity:1}

/* CONTENT */
.content{flex:1;padding:15px}

.tela{display:none}
.tela.ativa{display:block}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.card-top{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

/* LISTA */
.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}
.card.pago{border-left:5px solid green}
.card.pendente{border-left:5px solid red}

.actions{margin-top:8px;display:flex;gap:5px}

/* BUTTON */
button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:20px;
  border-radius:20px 20px 0 0;
  z-index:999;
  max-height:80vh;
  overflow:auto;
}

/* OVERLAY */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index:998;
}

/* FORM STYLE NUBANK */
.form-sheet{
  position:fixed;
  bottom:-100%;
  left:0;
  right:0;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:20px;
  z-index:999;
  transition:0.3s;
}

.form-sheet.active{
  bottom:0;
}

/* HEADER */
.form-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.btn-close{
  background:none;
  color:#333;
  font-size:18px;
}

/* INPUT */
.form-sheet input,
.form-sheet select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ACTIONS */
.form-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.btn-light{
  background:#e5e7eb;
  color:#333;
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="menu-item" onclick="abrirTela('dashboard')">🏠 <span>Dashboard</span></div>
  <div class="menu-item" onclick="abrirTela('lista')">👥 <span>Associados</span></div>
  <div class="menu-item" onclick="abrirTela('grafico')">📊 <span>Gráfico</span></div>
  <div class="menu-item" onclick="verRelatorio()">📄 <span>Relatório</span></div>
  <div class="menu-item" onclick="verDevedores()">⚠️ <span>Devedores</span></div>
</div>

<!-- CONTENT -->
<div class="content">

<header><h2>Cadastro Moradores Vila Floresta 2</h2></header>

<!-- DASHBOARD -->
<div id="tela-dashboard" class="tela">
  <div class="dashboard">
    <div class="card-top"><span>Total</span><b id="total">R$ 0</b></div>
    <div class="card-top"><span>Recebido</span><b id="pagos">0</b></div>
    <div class="card-top"><span>Pendentes</span><b id="pendentes">0</b></div>
    <div class="card-top"><span>Em aberto</span><b id="aberto">R$ 0</b></div>
  </div>
</div>

<input type="hidden" id="id">
<input id="nome">
<input id="cpf">
<input id="telefone">
<input id="email">
<input id="endereco">
<input id="mes">
<input id="valor">

<select id="status">
  <option value="Pago">Pago</option>
  <option value="Pendente">Pendente</option>
</select>

<form id="form">

    <input type="hidden" id="id">

    <input id="nome" placeholder="Nome" required>
    <input id="cpf" placeholder="CPF">
    <input id="telefone" placeholder="Telefone">
    <input id="email" placeholder="Email">
    <input id="endereco" placeholder="Endereço">
    <input id="mes" placeholder="Mês (03-2026)">
    <input id="valor" placeholder="Valor">

    <select id="status">
      <option value="Pago">Pago</option>
      <option value="Pendente">Pendente</option>
    </select>

    <div class="form-actions">
      <button type="submit" class="btn">Salvar</button>
      <button type="button" class="btn-light" onclick="fecharForm()">Cancelar</button>
    </div>

  </form>

<!-- LISTA -->
<div id="tela-lista" class="tela">
  <input id="busca" placeholder="Buscar...">
  <div id="lista"></div>
</div>

<!-- GRAFICO -->
<div id="tela-grafico" class="tela">
  <canvas id="grafico"></canvas>
</div>

</div>
</div>

<!-- MODAL -->
<div id="modalRelatorio" class="modal"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzJo9kKBNoakqcZlSJjMkKy_0a78raI6euNYn5g9uLvBQ4_PNqhnKk0i0K42DTxQty_/exec";
let dadosGlobal = [];

/* ===================== MÁSCARAS ===================== */
function maskCPF(v){
  v = v.replace(/\D/g,"").slice(0,11);
  if(v.length > 9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, "$1.$2.$3-$4");
  if(v.length > 6) return v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
  if(v.length > 3) return v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
  return v;
}

function maskTelefone(v){
  v = v.replace(/\D/g,"").slice(0,11);
  if(v.length > 10) return v.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
  if(v.length > 6) return v.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
  if(v.length > 2) return v.replace(/(\d{2})(\d{0,5})/, "($1) $2");
  return v;
}

/* ===================== CARREGAR ===================== */
async function carregar(){
  const res = await fetch(API_URL);
  const dados = await res.json();
  dadosGlobal = dados.slice(1);
  renderizar();
}

/* ===================== RENDER ===================== */
function renderizar(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  dadosGlobal.forEach(a=>{

    const status = a[8] || "Pendente";

    const botoes = status !== "Pago"
      ? `<button onclick="pagar('${a[0]}')">Pagar</button>`
      : `<button onclick="alert('Gerar recibo')">📄 Recibo</button>`;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <b>${a[1]}</b>
      <div>${a[6]}</div>
      <div>R$ ${a[7]}</div>
      <div>${status}</div>

      <button onclick="editar('${a[0]}')">Editar</button>
      ${botoes}
      <button onclick="excluir('${a[0]}')">Excluir</button>
    `;

    lista.appendChild(card);
  });
}

/* ===================== EDITAR ===================== */
function editar(idSel){

  const a = dadosGlobal.find(x=>x[0]==idSel);
  if(!a) return;

  document.getElementById("id").value = a[0];
  document.getElementById("nome").value = a[1];
  document.getElementById("cpf").value = a[2] || "";
  document.getElementById("telefone").value = a[3] || "";
  document.getElementById("email").value = a[4] || "";
  document.getElementById("endereco").value = a[5] || "";
  document.getElementById("mes").value = a[6] || "";
  document.getElementById("valor").value = a[7] || "";
  document.getElementById("status").value = a[8] || "Pendente";

  abrirForm();
}

/* ===================== PAGAR ===================== */
async function pagar(idSel){

  const a = dadosGlobal.find(x=>x[0]==idSel);
  if(!a) return;

  await fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      acao:"editar",
      id:a[0],
      nome:a[1],
      cpf:a[2],
      telefone:a[3],
      email:a[4],
      endereco:a[5],
      mes:a[6],
      valor:a[7],
      status:"Pago"
    })
  });

  carregar();
}

/* ===================== EXCLUIR ===================== */
async function excluir(idSel){

  if(!confirm("Deseja excluir?")) return;

  await fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({acao:"excluir", id:idSel})
  });

  carregar();
}

/* ===================== FORM ===================== */
function abrirForm(){
  document.getElementById("formBox").style.display="block";
}

function fecharForm(){
  document.getElementById("formBox").style.display="none";
  document.getElementById("form").reset();
}

/* ===================== INIT ===================== */
window.addEventListener("DOMContentLoaded", () => {

  const cpfInput = document.getElementById("cpf");
  const telInput = document.getElementById("telefone");
  const form = document.getElementById("form");

  // máscaras
  if(cpfInput){
    cpfInput.addEventListener("input", e=>{
      e.target.value = maskCPF(e.target.value);
    });
  }

  if(telInput){
    telInput.addEventListener("input", e=>{
      e.target.value = maskTelefone(e.target.value);
    });
  }

  // submit
  form.addEventListener("submit", async e=>{
    e.preventDefault();

    const obj = {
      acao: id.value ? "editar":"adicionar",
      id: id.value,
      nome: nome.value,
      cpf: cpf.value.replace(/\D/g,""),
      telefone: telefone.value.replace(/\D/g,""),
      email: email.value,
      endereco: endereco.value,
      mes: mes.value,
      valor: valor.value,
      status: status.value
    };

    await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify(obj)
    });

    fecharForm();
    carregar();
  });

  carregar();

});

</script>

<div id="overlay" class="overlay" onclick="fecharForm()"></div>

<div id="formBox" class="form-sheet">

  <div class="form-header">
    <h3 id="formTitulo">Novo Cadastro</h3>
    <button onclick="fecharForm()" class="btn-close">✕</button>
  </div>

  
</div>

</body>
</html>
