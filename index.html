<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Associação Vila Floresta 2
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <!-- HEADER -->
  <header>
    Associação Moradores Vila Floresta 2
  </header>


  <!-- APP -->
  <main class="container">

    <!-- NAV -->
    <nav class="nav">

      <button
        id="btn_dashboard"
        onclick="ir('dashboard')"
      >
        Dashboard
      </button>

      <button
        id="btn_associados"
        onclick="ir('associados')"
      >
        Associados
      </button>

      <button
        id="btn_devedores"
        onclick="ir('devedores')"
      >
        Devedores
      </button>

      <button
        id="btn_cobrancas"
        onclick="ir('cobrancas')"
      >
        Cobranças
      </button>

      <button
        id="btn_caixa"
        onclick="ir('caixa')"
      >
        Caixa
      </button>

      <button
        id="btn_fixas"
        onclick="ir('fixas')"
      >
        Fixas
      </button>

      <button
        id="btn_relatorios"
        onclick="ir('relatorios')"
      >
        📊 Relatórios
      </button>

      <button
        id="btn_reservas"
        onclick="ir('reservas')"
      >
        Reservas
      </button>

      <button id="btn_agenda" onclick="ir('agenda')">
        📅 Agenda
      </button>

      <button
        id="btn_backups"
        onclick="ir('backups')"
      >
        Backups
      </button>

    </nav>


    <!-- TELA -->
    <section id="tela"></section>

  </main>


  <!-- FAB -->
  <button
    class="fab"
    onclick="novo()"
    aria-label="Novo associado"
  >
    +
  </button>


  <!-- MODAL ASSOCIADO -->
  <div
    id="modal"
    class="modal"
    onclick="fecharModal()"
  >

    <div
      class="modal-box"
      onclick="event.stopPropagation()"
    >

      <h3 id="modalTitulo">
        Novo Associado
      </h3>

      <input id="m_nome" placeholder="Nome">

      <input id="m_cpf" placeholder="CPF">

      <input id="m_tel" placeholder="Telefone">

      <input id="m_email" placeholder="Email">

      <input id="m_endereco" placeholder="Endereço">

      <input
        id="m_mensal"
        placeholder="Mensalidade"
      >

      <select id="m_status">

        <option value="Ativo">
          Ativo
        </option>

        <option value="Inativo">
          Inativo
        </option>

      </select>

      <div class="acoes">

        <button
          id="btnSalvar"
          class="btn"
          onclick="salvarModal()"
        >
          Salvar
        </button>

        <button
          class="btn-cancelar"
          onclick="fecharModal()"
        >
          Cancelar
        </button>

      </div>

    </div>

  </div>


  <!-- MODAL MENSALIDADE -->
  <div
    id="modalMensalidade"
    class="modal"
    onclick="fecharModalMensalidade()"
  >

    <div
      class="modal-box"
      onclick="event.stopPropagation()"
    >

      <h3>
        Atualizar Mensalidade
      </h3>

      <p class="modal-subtitle">
        Valor atual:
      </p>

      <div id="valorAtualMensalidade"
        class="valor-mensalidade"
      >
        R$ 0,00
      </div>

      <input
        id="novoValorMensalidade"
        type="number"
        placeholder="Novo valor"
      >

      <div class="acoes">

        <button
          class="btn"
          onclick="salvarMensalidade()"
        >
          Salvar
        </button>

        <button
          class="btn-cancelar"
          onclick="fecharModalMensalidade()"
        >
          Cancelar
        </button>

      </div>

    </div>

  </div>


  <!-- CORE -->
  <script src="js/core/config.js"></script>
  <script src="js/core/state.js"></script>  

  <!-- COMPONENTS -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/loading.js"></script>
  <script src="js/components/dialog.js"></script>

  <!-- UTILS -->
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/dom.js"></script>  
  <script src="js/utils/format.js"></script>
  <script src="js/utils/masks.js"></script>
  <script src="js/utils/validators.js"></script>  

  <!-- API -->
  <script src="js/api/api.js"></script>
  <script src="js/api/request.js"></script>
  <script src="js/api/load.js"></script>

  <!-- COMPONENTS -->
  <script src="js/components/modal-core.js"></script>  
  <script src="js/components/modals.js"></script>

  <!-- MODULES associados -->
  <script src="js/modules/associados/status.js"></script>
  <script src="js/modules/associados/filter.js"></script>

  <!-- COMPONENTS associados -->
  <script src="js/components/associados-card.js"></script>
  <script src="js/components/associados-form.js"></script>

  <script src="js/modules/associados/render.js"></script>
  <script src="js/modules/associados/form.js"></script>  
  <script src="js/modules/associados/associados.js"></script>  

  <!-- SERVICES -->
  <script src="js/services/associados.service.js"></script>
  <script src="js/services/cobrancas.service.js"></script>  
  

  <!-- COBRANÇAS -->
  <script src="js/modules/cobrancas/render.js"></script>
  <script src="js/modules/cobrancas/filter.js"></script>
  <script src="js/modules/cobrancas/actions.js"></script>  
  <script src="js/modules/cobrancas/cobrancas.js"></script>


  <!-- MODULES -->
  
  <script src="js/modules/dashboard.js"></script>  
  <script src="js/modules/devedores.js"></script>  
  <script src="js/modules/caixa.js"></script>
  <script src="js/modules/fixas.js"></script>
  <script src="js/modules/reservas.js"></script>
  <script src="js/modules/relatorios.js"></script>
  <script src="js/modules/backups.js"></script>
  <script src="js/modules/recibos.js"></script>
  <script src="js/modules/agenda.js"></script>


  <!-- CORE FINAL -->
  <script src="js/core/navigation.js"></script>

  <script src="js/core/render.js"></script>
  <script src="js/core/init.js"></script>

</body>

</html>
