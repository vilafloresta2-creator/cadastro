<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vila Floresta 2</title>

<style>
body{
  font-family:Arial;
  margin:0;
  color:#fff;
  background: radial-gradient(circle at top, #1f2937, #0f172a 60%);
}

/* CONTAINER */
.container{
  padding:20px;
  max-width:1000px;
  margin:auto;
}

/* NAV */
.nav{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.nav button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#020617;
  color:#94a3b8;
}

.nav button.active{
  background:#2563eb;
  color:#fff;
}

/* CARD */
.card{
  background:#1f2937;
  padding:15px;
  border-radius:14px;
  margin-top:10px;
}

/* INPUT */
input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:#fff;
}

/* BOTÕES */
.btn{
  background:#2563eb;
  padding:10px;
  border:none;
  color:#fff;
  border-radius:10px;
}

.btn-saida{
  background:#dc2626;
}

.btn-cancelar{
  background:#475569;
}

.btn-cancelar:hover{
  background:#64748b;
}

/* FILTROS */
.linha-filtros{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.linha-filtros input{
  flex:1;
  min-width:0;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#1e293b;
  padding:25px;
  width:90%;
  max-width:400px;
  border-radius:16px;
  box-sizing:border-box;
}

.modal input{
  margin-bottom:12px;
  box-sizing:border-box;
}
</style>
</head>

<body>

<div class="container">

<div class="nav">
  <button onclick="ir('caixa')" id="btn_caixa">Caixa</button>
  <button onclick="ir('backups')" id="btn_backups">Backups</button>
</div>

<div id="tela"></div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxfs77PRmkxF7VnlueGfpYjpNoRmuXEDc9q7uZ0nw6VJlDgz2t1uauKjByzVx8Bud7c/exec";

/* ================= NAV ================= */
function ir(t){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn_"+t).classList.add("active");

  if(t==="caixa") renderCaixa();
  if(t==="backups") renderBackups();
}

/* ================= FETCH PADRÃO ================= */
function post(data){
  return fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(data)
  }).then(r=>r.json());
}

/* ================= CAIXA ================= */
let caixa = [];

async function carregar(){
  const res = await fetch(API);
  const data = await res.json();
  caixa = data.caixa.slice(1);
}

function renderCaixa(){
  tela.innerHTML = `
    <div class="linha-filtros">
      <input id="buscaCaixa" placeholder="Buscar...">
    </div>

    <button class="btn" onclick="abrirModal('Entrada')">+ Entrada</button>
    <button class="btn btn-saida" onclick="abrirModal('Saida')">- Saída</button>

    <div id="lista"></div>
  `;

  listar();
}

function listar(){
  const busca = (buscaCaixa.value||"").toLowerCase();

  let html="";

  caixa.filter(c=>String(c[3]).toLowerCase().includes(busca))
  .forEach(c=>{
    html+=`<div class="card">
      ${c[3]} - R$ ${c[5]}
    </div>`;
  });

  lista.innerHTML = html;
}

let tipo="Entrada";

function abrirModal(t){
  tipo=t;
  modal.style.display="flex";
}

function fecharModal(){
  modal.style.display="none";
}

async function salvar(){
  await post({
    acao:"lancar_caixa",
    tipo,
    categoria:cat.value,
    descricao:desc.value,
    valor:valor.value
  });

  fecharModal();
  carregar().then(renderCaixa);
}

/* ================= BACKUP ================= */
function renderBackups(){
  tela.innerHTML=`
    <button class="btn" onclick="backup()">Fazer Backup</button>
  `;
}

async function backup(){
  const r = await post({acao:"backup"});
  alert("Backup criado");
  window.open(r.url);
}

/* INIT */
carregar().then(()=>ir("caixa"));

</script>

<!-- MODAL -->
<div id="modal" class="modal" onclick="fecharModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <input id="cat" placeholder="Categoria">
    <input id="desc" placeholder="Descrição">
    <input id="valor" placeholder="Valor">

    <button class="btn" onclick="salvar()">Salvar</button>
    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

</body>
</html>
