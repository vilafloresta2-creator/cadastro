<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Associados</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  margin:0;
  background:#eef2f7;
}

header{
  background:#2563eb;
  color:#fff;
  padding:15px;
  text-align:center;
  font-weight:600;
}

.container{padding:15px;max-width:600px;margin:auto}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card-top{
  background:#fff;
  padding:12px;
  border-radius:14px;
}

.card-top b{font-size:18px}

/* CARD */
.card{
  background:#fff;
  padding:15px;
  border-radius:16px;
  margin-top:12px;
}

.card.pago{border-left:5px solid green}
.card.pendente{border-left:5px solid red}

/* BOTÕES */
button{
  border:none;
  padding:8px;
  border-radius:8px;
  color:#fff;
}

.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}

/* FORM */
.form-box{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:15px;
  border-radius:20px 20px 0 0;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
}

.floating{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  font-size:30px;
}
</style>
</head>

<body>

<header>Vila Floresta 2</header>

<div class="container">

<!-- DASHBOARD -->
<div class="dashboard">
  <div class="card-top"><span>Total</span><b id="total">R$ 0</b></div>
  <div class="card-top"><span>Recebido</span><b id="pagos">0</b></div>
  <div class="card-top"><span>Pendentes</span><b id="pendentes">0</b></div>
  <div class="card-top"><span>Em aberto</span><b id="aberto">R$ 0</b></div>
</div>

<!-- GRÁFICO -->
<canvas id="grafico"></canvas>

<input id="busca" placeholder="Buscar...">
<div id="lista"></div>

</div>

<button class="floating" onclick="abrirForm()">+</button>

<div class="form-box" id="formBox">
<form id="form">
<input type="hidden" id="id">
<input id="nome" placeholder="Nome">
<input id="mes" placeholder="03-2026">
<input id="valor" placeholder="Valor">
<select id="status">
<option value="Pago">Pago</option>
<option value="Pendente">Pendente</option>
</select>
<button class="btn">Salvar</button>
</form>
</div>

<script>

const URL = "COLE_SEU_SCRIPT_URL_AQUI";
let dadosGlobal=[];
let grafico;

/* ===================== CARREGAR ===================== */
async function carregar(){
  const res = await fetch(URL);
  const dados = await res.json();
  dadosGlobal = dados.slice(1);

  renderizar();
  calcular();
  atualizarGrafico();
}

/* ===================== CALCULO ===================== */
function calcular(){
  let total=0, pagos=0, pendentes=0, aberto=0;

  dadosGlobal.forEach(a=>{
    const valor = Number(a[7]) || 0;
    const status = a[8] || "Pendente";

    if(status==="Pago"){
      total += valor;
      pagos++;
    }else{
      aberto += valor;
      pendentes++;
    }
  });

  set("total","R$ "+total.toFixed(2));
  set("pagos",pagos);
  set("pendentes",pendentes);
  set("aberto","R$ "+aberto.toFixed(2));
}

/* ===================== UTIL ===================== */
function set(id,val){
  const el=document.getElementById(id);
  if(el) el.innerText=val;
}

/* ===================== RENDER ===================== */
function renderizar(filtro=""){
  lista.innerHTML="";

  dadosGlobal
  .filter(a=>a[1].toLowerCase().includes(filtro))
  .forEach(a=>{

    const status=a[8]||"Pendente";

    const card=document.createElement("div");
    card.className="card "+(status==="Pago"?"pago":"pendente");

    card.innerHTML=`
      <b>${a[1]}</b>
      <div>${a[6]}</div>
      <div>R$ ${a[7]}</div>
      <div>${status}</div>

      <button class="btn-edit" onclick="editar('${a[0]}')">Editar</button>
      <button class="btn" onclick="pagar('${a[0]}')">Pagar</button>
      <button class="btn-danger" onclick="excluir('${a[0]}')">Excluir</button>
    `;

    lista.appendChild(card);
  });
}

/* ===================== GRAFICO ===================== */
function atualizarGrafico(){
  let pago=0, pendente=0;

  dadosGlobal.forEach(a=>{
    const valor = Number(a[7])||0;
    if(a[8]==="Pago") pago+=valor;
    else pendente+=valor;
  });

  const ctx=document.getElementById("grafico");

  if(grafico) grafico.destroy();

  grafico=new Chart(ctx,{
    type:"doughnut",
    data:{
      labels:["Pago","Pendente"],
      datasets:[{data:[pago,pendente]}]
    },
    options:{cutout:"70%"}
  });
}

/* ===================== AÇÕES ===================== */
form.addEventListener("submit",async e=>{
  e.preventDefault();

  const obj={
    acao:id.value?"editar":"adicionar",
    id:id.value,
    nome:nome.value,
    mes:mes.value,
    valor:valor.value,
    status:status.value
  };

  await fetch(URL,{method:"POST",body:JSON.stringify(obj)});

  form.reset();
  fecharForm();
  carregar();
});

function editar(idSel){
  const a=dadosGlobal.find(x=>x[0]==idSel);
  id.value=a[0];
  nome.value=a[1];
  mes.value=a[6];
  valor.value=a[7];
  status.value=a[8];
  abrirForm();
}

async function pagar(idSel){
  const a=dadosGlobal.find(x=>x[0]==idSel);

  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      acao:"editar",
      id:a[0],
      nome:a[1],
      mes:a[6],
      valor:a[7],
      status:"Pago"
    })
  });

  carregar();
}

async function excluir(idSel){
  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({acao:"excluir",id:idSel})
  });
  carregar();
}

/* ===================== UI ===================== */
busca.addEventListener("input",e=>{
  renderizar(e.target.value.toLowerCase());
});

function abrirForm(){formBox.style.display="block"}
function fecharForm(){formBox.style.display="none"}

carregar();

</script>

</body>
</html>
