<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Associados</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}

body{margin:0;background:#eef2f7}

/* LAYOUT */
.app{display:flex}

/* SIDEBAR */
.sidebar{
  width:70px;
  background:#1e293b;
  color:#fff;
  height:100vh;
  transition:.3s;
  overflow:hidden;
}
.sidebar:hover{width:200px}

.menu-item{
  padding:15px;
  cursor:pointer;
  display:flex;
  gap:10px;
}
.menu-item span{opacity:0;transition:.3s}
.sidebar:hover span{opacity:1}

/* CONTENT */
.content{flex:1;padding:15px}

.tela{display:none}
.tela.ativa{display:block}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.card-top{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

/* LISTA */
.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}
.card.pago{border-left:5px solid green}
.card.pendente{border-left:5px solid red}

.actions{margin-top:8px;display:flex;gap:5px}

/* BUTTON */
button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:20px;
  border-radius:20px 20px 0 0;
  z-index:999;
  max-height:80vh;
  overflow:auto;
}

/* OVERLAY */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index:998;
}

/* FORM STYLE NUBANK */
.form-sheet{
  position:fixed;
  bottom:-100%;
  left:0;
  right:0;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:20px;
  z-index:999;
  transition:0.3s;
}

.form-sheet.active{
  bottom:0;
}

/* HEADER */
.form-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.btn-close{
  background:none;
  color:#333;
  font-size:18px;
}

/* INPUT */
.form-sheet input,
.form-sheet select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ACTIONS */
.form-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.btn-light{
  background:#e5e7eb;
  color:#333;
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="menu-item" onclick="abrirTela('dashboard')">🏠 <span>Dashboard</span></div>
  <div class="menu-item" onclick="abrirTela('lista')">👥 <span>Associados</span></div>
  <div class="menu-item" onclick="abrirTela('grafico')">📊 <span>Gráfico</span></div>
  <div class="menu-item" onclick="verRelatorio()">📄 <span>Relatório</span></div>
  <div class="menu-item" onclick="verDevedores()">⚠️ <span>Devedores</span></div>
</div>

<!-- CONTENT -->
<div class="content">

<header><h2>Cadastro Moradores Vila Floresta 2</h2></header>

<!-- DASHBOARD -->
<div id="tela-dashboard" class="tela">
  <div class="dashboard">
    <div class="card-top"><span>Total</span><b id="total">R$ 0</b></div>
    <div class="card-top"><span>Recebido</span><b id="pagos">0</b></div>
    <div class="card-top"><span>Pendentes</span><b id="pendentes">0</b></div>
    <div class="card-top"><span>Em aberto</span><b id="aberto">R$ 0</b></div>
  </div>
</div>

<input type="hidden" id="id">
<input id="nome">
<input id="cpf">
<input id="telefone">
<input id="email">
<input id="endereco">
<input id="mes">
<input id="valor">

<select id="status">
  <option value="Pago">Pago</option>
  <option value="Pendente">Pendente</option>
</select>

<form id="form">

    <input type="hidden" id="id">

    <input id="nome" placeholder="Nome" required>
    <input id="cpf" placeholder="CPF">
    <input id="telefone" placeholder="Telefone">
    <input id="email" placeholder="Email">
    <input id="endereco" placeholder="Endereço">
    <input id="mes" placeholder="Mês (03-2026)">
    <input id="valor" placeholder="Valor">

    <select id="status">
      <option value="Pago">Pago</option>
      <option value="Pendente">Pendente</option>
    </select>

    <div class="form-actions">
      <button type="submit" class="btn">Salvar</button>
      <button type="button" class="btn-light" onclick="fecharForm()">Cancelar</button>
    </div>

  </form>

<!-- LISTA -->
<div id="tela-lista" class="tela">
  <input id="busca" placeholder="Buscar...">
  <div id="lista"></div>
</div>

<!-- GRAFICO -->
<div id="tela-grafico" class="tela">
  <canvas id="grafico"></canvas>
</div>

</div>
</div>

<!-- MODAL -->
<div id="modalRelatorio" class="modal"></div>

<script>

/* CONFIG */
const API_URL = "https://script.google.com/macros/s/AKfycbzJo9kKBNoakqcZlSJjMkKy_0a78raI6euNYn5g9uLvBQ4_PNqhnKk0i0K42DTxQty_/exec";
let dadosGlobal=[];
let grafico;

/* NAV */
function abrirTela(nome){
  document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
  document.getElementById("tela-"+nome).classList.add("ativa");

  if(nome==="grafico") atualizarGrafico();
}

function abrirForm(edicao = false){

  document.getElementById("formBox").classList.add("active");
  document.getElementById("overlay").style.display = "block";

  document.getElementById("formTitulo").innerText =
    edicao ? "Editar Cadastro" : "Novo Cadastro";
}

function fecharForm(){

  document.getElementById("formBox").classList.remove("active");
  document.getElementById("overlay").style.display = "none";

  form.reset();
  id.value = "";
}

/* PAGAR */
async function pagar(idSel){

  const a = dadosGlobal.find(x => x[0] == idSel);
  if(!a) return;

  try{

    await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify({
        acao:"editar",
        id:a[0],
        nome:a[1],
        cpf:a[2],
        telefone:a[3],
        email:a[4],
        endereco:a[5],
        mes:a[6],
        valor:a[7],
        status:"Pago"
      })
    });

    carregar();

  }catch(e){
    alert("Erro ao atualizar pagamento");
    console.error(e);
  }
}

/* LOAD */
async function carregar(){
  const res = await fetch(API_URL);
  const dados = await res.json();
  dadosGlobal = dados.slice(1);

  renderizar();
  calcular();
  backupAutomatico();
}

/* EXCLUIR */
async function excluir(idSel){

  const confirmar = confirm("Tem certeza que deseja excluir?");
  if(!confirmar) return;

  try{

    await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify({
        acao:"excluir",
        id:idSel
      })
    });

    carregar();

  }catch(e){
    alert("Erro ao excluir");
    console.error(e);
  }
}

/* EDITAR */
function editar(idSel){

  const a = dadosGlobal.find(x => x[0] == idSel);
  if(!a) return;

  id.value = a[0];
  nome.value = a[1];
  cpf.value = a[2] || "";
  telefone.value = a[3] || "";
  email.value = a[4] || "";
  endereco.value = a[5] || "";
  mes.value = a[6] || "";
  valor.value = a[7] || "";
  document.getElementById("status").value = a[8] || "Pendente";

  abrirForm(true);
}

/* DASH */
function calcular(){
  let total=0,pagos=0,pendentes=0,aberto=0;

  dadosGlobal.forEach(a=>{
    const v=Number(a[7])||0;
    if(a[8]==="Pago"){total+=v;pagos++}
    else{aberto+=v;pendentes++}
  });

  set("total","R$ "+total.toFixed(2));
  set("pagos",pagos);
  set("pendentes",pendentes);
  set("aberto","R$ "+aberto.toFixed(2));
}

function set(id,val){
  const el=document.getElementById(id);
  if(el) el.innerText=val;
}

/* LISTA */
function renderizar(f=""){
  lista.innerHTML="";

  dadosGlobal.filter(a=>a[1].toLowerCase().includes(f))
  .forEach(a=>{

    const status=a[8]||"Pendente";

    const card=document.createElement("div");
    card.className="card "+(status==="Pago"?"pago":"pendente");

    card.innerHTML=`
      <b>${a[1]}</b>
      <div>${a[6]} - R$ ${a[7]}</div>

      <div class="actions">
        <button class="btn-edit" onclick="event.stopPropagation();editar('${a[0]}')">Editar</button>

        ${
          status!=="Pago"
          ? `<button class="btn" onclick="event.stopPropagation();pagar('${a[0]}')">Pagar</button>`
          : `<button class="btn" onclick="event.stopPropagation();gerarPDF('${a[0]}')">📄</button>`
        }

        <button class="btn" onclick="event.stopPropagation();enviarWhatsApp('${a[0]}')">📲</button>
        <button class="btn-danger" onclick="event.stopPropagation();excluir('${a[0]}')">X</button>
      </div>
    `;

    lista.appendChild(card);
  });
}

/* GRAFICO */
function atualizarGrafico(){
  let p=0,d=0;

  dadosGlobal.forEach(a=>{
    const v=Number(a[7])||0;
    if(a[8]==="Pago") p+=v;
    else d+=v;
  });

  const ctx=document.getElementById("grafico");

  if(grafico) grafico.destroy();

  grafico=new Chart(ctx,{
    type:"doughnut",
    data:{labels:["Pago","Pendente"],datasets:[{data:[p,d]}]},
    options:{cutout:"70%"}
  });
}

/* MASCARAS */
function maskCPF(v){
  v = v.replace(/\D/g,"");
  v = v.replace(/(\d{3})(\d)/,"$1.$2");
  v = v.replace(/(\d{3})(\d)/,"$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  return v;
}

function maskTelefone(v){
  v = v.replace(/\D/g,"");

  if(v.length <= 10){
    // fixo
    v = v.replace(/(\d{2})(\d)/,"($1) $2");
    v = v.replace(/(\d{4})(\d)/,"$1-$2");
  }else{
    // celular
    v = v.replace(/(\d{2})(\d)/,"($1) $2");
    v = v.replace(/(\d{5})(\d)/,"$1-$2");
  }

  return v;
}

/* WHATS */
function enviarWhatsApp(idSel){
  const a=dadosGlobal.find(x=>x[0]==idSel);
  let num=(a[3]||"").replace(/\D/g,"");
  if(!num) return alert("Sem telefone");

  if(!num.startsWith("55")) num="55"+num;

  const msg=`Olá ${a[1]}%0AValor: R$ ${a[7]}`;
  window.open(`https://wa.me/${num}?text=${msg}`);
}

/* PDF */
function gerarPDF(idSel){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"landscape"});

  const a=dadosGlobal.find(x=>x[0]==idSel);

  doc.text("RECIBO",20,20);
  doc.text(a[1],20,40);
  doc.text("R$ "+a[7],20,50);

  doc.save("recibo.pdf");
}

/* RELATORIO */
function verRelatorio(){
  let html="<h3>Relatório</h3>";

  dadosGlobal.forEach(a=>{
    html+=`<div>${a[1]} - R$ ${a[7]}</div>`;
  });

  html+=`<button onclick="gerarRelatorio()" class="btn">PDF</button>
  <button onclick="fecharRelatorio()" class="btn-danger">Fechar</button>`;

  modalRelatorio.innerHTML=html;
  modalRelatorio.style.display="block";
}

function verDevedores(){
  let html="<h3>Devedores</h3>";

  dadosGlobal.filter(a=>a[8]!=="Pago")
  .forEach(a=>{
    html+=`<div>${a[1]} - R$ ${a[7]}</div>`;
  });

  html+=`<button onclick="gerarDevedores()" class="btn">PDF</button>
  <button onclick="fecharRelatorio()" class="btn-danger">Fechar</button>`;

  modalRelatorio.innerHTML=html;
  modalRelatorio.style.display="block";
}

function fecharRelatorio(){
  modalRelatorio.style.display="none";
}

/* BACKUP */
function backupAutomatico(){
  const hoje=new Date().toISOString().slice(0,10);
  if(localStorage.getItem("backup_data")===hoje) return;

  localStorage.setItem("backup_associados",JSON.stringify(dadosGlobal));
  localStorage.setItem("backup_data",hoje);
}

/* ===================== INIT ===================== */
busca.addEventListener("input",e=>renderizar(e.target.value.toLowerCase()));

abrirTela("dashboard");
carregar();

cpf.addEventListener("input", e=>{
  e.target.value = maskCPF(e.target.value);
});

telefone.addEventListener("input", e=>{
  e.target.value = maskTelefone(e.target.value);
});

window.addEventListener("DOMContentLoaded", () => {

  // inputs
  const cpfInput = document.getElementById("cpf");
  const telInput = document.getElementById("telefone");

  // máscara CPF
  if(cpfInput){
    cpfInput.addEventListener("input", e=>{
      e.target.value = maskCPF(e.target.value);
    });
  }

  // máscara telefone
  if(telInput){
    telInput.addEventListener("input", e=>{
      e.target.value = maskTelefone(e.target.value);
    });
  }

  // busca
  const buscaInput = document.getElementById("busca");
  if(buscaInput){
    buscaInput.addEventListener("input", e=>{
      renderizar(e.target.value.toLowerCase());
    });
  }

  // start app
  abrirTela("dashboard");
  carregar();

});

window.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("form");

  if(form){
    form.addEventListener("submit", async e=>{
      e.preventDefault();

      const obj = {
        acao: id.value ? "editar" : "adicionar",
        id: id.value,
        nome: nome.value,

        // 🔥 limpa máscara aqui
        cpf: cpf.value.replace(/\D/g,""),
        telefone: telefone.value.replace(/\D/g,""),

        email: email.value,
        endereco: endereco.value,
        mes: mes.value,
        valor: valor.value,
        status: document.getElementById("status").value
      };

      try{

        await fetch(API_URL,{
          method:"POST",
          body: JSON.stringify(obj)
        });

        form.reset();
        fecharForm();
        carregar();

      }catch(e){
        alert("Erro ao salvar");
        console.error(e);
      }

    });
  }

});

</script>

<div id="overlay" class="overlay" onclick="fecharForm()"></div>

<div id="formBox" class="form-sheet">

  <div class="form-header">
    <h3 id="formTitulo">Novo Cadastro</h3>
    <button onclick="fecharForm()" class="btn-close">✕</button>
  </div>

  
</div>

</body>
</html>
