<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vila Floresta 2</title>

<style>
body{font-family:Arial;margin:0;background:#eef2f7}
header{background:#2563eb;color:#fff;padding:15px;text-align:center}

.container{padding:15px;max-width:700px;margin:auto}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

button{
  border:none;
  padding:6px 10px;
  margin:3px;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
}

.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}

.form-box{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:15px;
  border-radius:20px 20px 0 0;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
}

.modal{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:12px;
}
</style>
</head>

<body>

<header>Vila Floresta 2</header>

<div class="container">

<button class="btn" onclick="abrirForm()">+ Novo</button>
<button class="btn" onclick="verRelatorio()">📊 Relatório</button>
<button class="btn" onclick="verDevedores()">⚠️ Devedores</button>

<div id="lista"></div>

</div>

<!-- FORM -->
<div id="overlay" class="overlay" onclick="fecharForm()"></div>

<div id="formBox" class="form-box">
<form id="form">

<input type="hidden" id="id">
<input id="nome" placeholder="Nome" required>
<input id="cpf" placeholder="CPF">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="Email">
<input id="endereco" placeholder="Endereço">
<input id="mes" placeholder="03-2026">
<input id="valor" placeholder="Valor">

<select id="status">
<option value="Pago">Pago</option>
<option value="Pendente">Pendente</option>
</select>

<button class="btn">Salvar</button>
<button type="button" onclick="fecharForm()">Cancelar</button>

</form>
</div>

<!-- MODAL -->
<div id="modal" class="modal"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzJo9kKBNoakqcZlSJjMkKy_0a78raI6euNYn5g9uLvBQ4_PNqhnKk0i0K42DTxQty_/exec";
let dadosGlobal=[];

/* ================= CARREGAR ================= */
async function carregar(){
  const res = await fetch(API_URL);
  const dados = await res.json();
  dadosGlobal = dados.slice(1);
  renderizar();
}

/* ================= RENDER ================= */
function renderizar(){

  const lista = document.getElementById("lista");
  lista.innerHTML="";

  dadosGlobal.forEach(a=>{

    const status = a[8] || "Pendente";

const cor = status === "Pago" ? "green" : "red";

const botoes = status !== "Pago"
  ? `<button class="btn" onclick="pagar('${a[0]}')">Pagar</button>`
  : `<button class="btn" onclick="gerarPDF('${a[0]}')">📄 Recibo</button>`;

card.innerHTML = `
  <div style="border-left:5px solid ${cor}; padding-left:10px">
    <b>${a[1]}</b><br>
    ${a[6]}<br>
    <b>R$ ${a[7]}</b><br>
    <span style="color:${cor}">${status}</span><br>

    <button class="btn-edit" onclick="editar('${a[0]}')">Editar</button>
    ${botoes}
    <button class="btn-danger" onclick="excluir('${a[0]}')">Excluir</button>
  </div>
`;

    lista.appendChild(card);
  });
}

/* ================= GERAR PDF ================= */
function gerarPDF(idSel){

  const a = dadosGlobal.find(x=>x[0]==idSel);
  if(!a) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("landscape");

  doc.setFontSize(18);
  doc.text("RECIBO DE PAGAMENTO", 105, 30, null, null, "center");

  doc.setFontSize(12);

  doc.text(`Nome: ${a[1]}`, 20, 60);
  doc.text(`Mês: ${a[6]}`, 20, 70);
  doc.text(`Valor: R$ ${a[7]}`, 20, 80);
  doc.text(`Status: ${a[8]}`, 20, 90);

  doc.text("Assinatura: __________________________", 20, 120);

  doc.save("recibo.pdf");
}

/* ================= FORM ================= */
function abrirForm(edicao=false){

  document.getElementById("formBox").style.display="block";
  document.getElementById("overlay").style.display="block";

  document.getElementById("formTitulo").innerText =
    edicao ? "Editar Cadastro" : "Novo Cadastro";
}

function fecharForm(){
  overlay.style.display="none";
  formBox.style.display="none";
  form.reset();
  id.value="";
}

/* ================= EDITAR ================= */
function editar(idSel){

  const a = dadosGlobal.find(x => x[0] == idSel);
  if(!a) return;

  document.getElementById("id").value = a[0];
  document.getElementById("nome").value = a[1];
  document.getElementById("cpf").value = a[2] || "";
  document.getElementById("telefone").value = a[3] || "";
  document.getElementById("email").value = a[4] || "";
  document.getElementById("endereco").value = a[5] || "";
  document.getElementById("mes").value = a[6] || "";
  document.getElementById("valor").value = a[7] || "";
  document.getElementById("status").value = a[8] || "Pendente";

  abrirForm(true);
}

/* ================= PAGAR ================= */
async function pagar(idSel){

  const a = dadosGlobal.find(x=>x[0]==idSel);

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      acao:"editar",
      id:a[0],
      nome:a[1],
      cpf:a[2],
      telefone:a[3],
      email:a[4],
      endereco:a[5],
      mes:a[6],
      valor:a[7],
      status:"Pago"
    })
  });

  carregar();
}

/* ================= EXCLUIR ================= */
async function excluir(idSel){

  if(!confirm("Deseja excluir?")) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({acao:"excluir",id:idSel})
  });

  carregar();
}

/* ================= SUBMIT ================= */
form.addEventListener("submit", async e=>{
  e.preventDefault();

  const obj={
    acao:id.value?"editar":"adicionar",
    id:id.value,
    nome:nome.value,
    cpf:cpf.value.replace(/\D/g,""),
    telefone:telefone.value.replace(/\D/g,""),
    email:email.value,
    endereco:endereco.value,
    mes:mes.value,
    valor:valor.value,
    status: document.getElementById("status").value
  };

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(obj)
  });

  fecharForm();
  carregar();
});

/* ================= RELATORIO ================= */
function verRelatorio(){

  let html="<h3>Relatório</h3>";

  dadosGlobal.forEach(a=>{
    html+=`${a[1]} - R$ ${a[7]} - ${a[8]}<br>`;
  });

  abrirModal(html);
}

/* ================= DEVEDORES ================= */
function verDevedores(){

  let html="<h3>Devedores</h3>";

  dadosGlobal
  .filter(a=>a[8]!=="Pago")
  .forEach(a=>{
    html+=`${a[1]} - R$ ${a[7]}<br>`;
  });

  abrirModal(html);
}

/* ================= MODAL ================= */
function abrirModal(html){
  modal.innerHTML=html;
  modal.style.display="block";
  overlay.style.display="block";
}

overlay.onclick=()=>{
  modal.style.display="none";
  fecharForm();
};

/* ================= MASCARAS ================= */
cpf.addEventListener("input", e=>{
  e.target.value = e.target.value
    .replace(/\D/g,"")
    .replace(/(\d{3})(\d)/,"$1.$2")
    .replace(/(\d{3})(\d)/,"$1.$2")
    .replace(/(\d{3})(\d{1,2})$/,"$1-$2");
});

telefone.addEventListener("input", e=>{
  let v = e.target.value.replace(/\D/g,"");
  if(v.length>10)
    v=v.replace(/(\d{2})(\d{5})(\d)/,"($1) $2-$3");
  else
    v=v.replace(/(\d{2})(\d{4})(\d)/,"($1) $2-$3");
  e.target.value=v;
});

/* INIT */
carregar();

</script>

</body>
</html>
