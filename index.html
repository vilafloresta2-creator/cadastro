<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vila Floresta 2</title>

<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center;font-size:18px}

.container{padding:15px;max-width:900px;margin:auto}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.nav button{
  flex:1;
  padding:10px;
  background:#1e293b;
  border:none;
  color:#fff;
  border-radius:8px;
}

.nav button.active{
  background:#2563eb;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:none;
}

.btn{
  background:#2563eb;
  padding:8px;
  border:none;
  color:#fff;
  border-radius:6px;
}

.btn-danger{background:#ef4444}
.btn-edit{background:#f59e0b}

.top{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.box{
  background:#1e293b;
  padding:10px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<header>Vila Floresta 2</header>

<div class="container">

<div class="nav">
  <button onclick="ir('dashboard')" id="btn_dashboard">Dashboard</button>
  <button onclick="ir('cobrancas')" id="btn_cobrancas">Cobranças</button>
  <button onclick="ir('associados')" id="btn_associados">Associados</button>
</div>

<div id="tela"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwL51y2O7h7H3qfT9e2ZPZjy0nzakrV0T9QI-p1RCDIICxmdR-jNp39ufoOoDAxhb0M/exec";

let associados = [];
let cobrancas = [];
let telaAtual = "dashboard";

/* ================= CARREGAR ================= */
async function carregar(){

  let res = await fetch(API);
  let data = await res.json();

  associados = data.associados.slice(1);
  cobrancas = data.cobrancas.slice(1);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({acao:"gerar_cobrancas"})
  });

  res = await fetch(API);
  data = await res.json();

  associados = data.associados.slice(1);
  cobrancas = data.cobrancas.slice(1);

  render();
}

/* ================= NAVEGAÇÃO ================= */
function ir(tela){
  telaAtual = tela;

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  document.getElementById("btn_"+tela).classList.add("active");

  render();
}

/* ================= RENDER ================= */
function render(){

  if(telaAtual === "dashboard") renderDashboard();
  if(telaAtual === "cobrancas") renderCobrancas();
  if(telaAtual === "associados") renderAssociados();

}

/* ================= DASHBOARD ================= */
function renderDashboard(){

  let total=0, aberto=0;

  cobrancas.forEach(c=>{
    if(c[5]=="Pago") total+=Number(c[4]);
    else aberto+=Number(c[4]);
  });

  tela.innerHTML = `
    <div class="top">
      <div class="box">
        <b>Recebido</b><br>R$ ${total.toFixed(2)}
      </div>
      <div class="box">
        <b>Pendente</b><br>R$ ${aberto.toFixed(2)}
      </div>
      <div class="box">
        <b>Associados</b><br>${associados.length}
      </div>
    </div>
  `;
}

/* ================= COBRANÇAS ================= */
function renderCobrancas(){

  let meses = [...new Set(cobrancas.map(c=>c[3]))];

  tela.innerHTML = `
    <select id="filtroMes">
      <option value="">Todos</option>
      ${meses.map(m=>`<option>${m}</option>`).join("")}
    </select>
    <div id="lista"></div>
  `;

  document.getElementById("filtroMes").onchange = listar;
  listar();
}

function listar(){

  const mes = document.getElementById("filtroMes").value;

  let lista = cobrancas;

  if(mes){
    lista = lista.filter(c=>c[3]==mes);
  }

  let html = "";

  lista.forEach(c=>{

    html += `
      <div class="card">
        <b>${c[1]}</b><br>
        ${c[3]} - R$ ${c[4]}<br>
        <b>${c[5]}</b><br>

        ${c[5]=="Pendente" ? 
          `<button class="btn" onclick="pagar('${c[0]}')">Pagar</button>` 
        : ""}
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

/* ================= PAGAR ================= */
async function pagar(id){

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({acao:"pagar",id})
  });

  carregar();
}

/* ================= ASSOCIADOS ================= */
function renderAssociados(){

  tela.innerHTML = `
    <input placeholder="Buscar..." id="busca">
    <button class="btn" onclick="novo()">+ Novo</button>
    <div id="lista"></div>
  `;

  document.getElementById("busca").oninput = listarAssociados;

  listarAssociados();
}

function listarAssociados(){

  const busca = document.getElementById("busca").value.toLowerCase();

  let lista = associados.filter(a=>a[1].toLowerCase().includes(busca));

  let html = "";

  lista.forEach(a=>{
    html += `
      <div class="card">
        <b>${a[1]}</b><br>
        CPF: ${a[2]}<br>

        <button class="btn-edit" onclick="editar('${a[0]}')">Editar</button>
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

/* ================= FORM ================= */
function novo(){
  const nome = prompt("Nome:");
  const cpf = prompt("CPF:");
  const tel = prompt("Telefone:");
  const mensal = prompt("Mensalidade:");

  salvar({nome,cpf,telefone:tel,mensalidade:mensal});
}

function editar(id){

  const a = associados.find(x=>x[0]==id);

  const nome = prompt("Nome:",a[1]);
  const cpf = prompt("CPF:",a[2]);
  const tel = prompt("Telefone:",a[3]);
  const mensal = prompt("Mensalidade:",a[4]);

  salvar({id,nome,cpf,telefone:tel,mensalidade:mensal});
}

/* ================= SALVAR ================= */
async function salvar(obj){

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      acao:"salvar_associado",
      ...obj
    })
  });

  carregar();
}

/* INIT */
carregar();
ir("dashboard");
</script>

</body>
</html>
