<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro Associados</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial;
  margin:0;
  background:#eef2f7;
}

header{
  background:#2563eb;
  color:#fff;
  padding:15px;
  text-align:center;
}

#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(3px);
  display:none;
  z-index:998;
}

#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#22c55e;
  color:#fff;
  padding:12px 20px;
  border-radius:20px;
  opacity:0;
  transition:0.3s;
  z-index:9999;
}

.container{padding:15px;max-width:600px;margin:auto}

.dashboard{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card-top{
  background:#fff;
  padding:12px;
  border-radius:12px;
}

.card{
  background:#fff;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  transition:0.2s;
}

.card:active{
  transform:scale(0.97);
}

.card.pago{border-left:5px solid green}
.card.pendente{border-left:5px solid red}

button{
  padding:8px;
  border:none;
  border-radius:8px;
  color:#fff;
}

.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}

.form-box{
  position:fixed;
  bottom:-100%; /* 👈 ESSENCIAL */
  left:0;
  right:0;
  background:#fff;
  padding:15px;
  border-radius:20px 20px 0 0;
  transition:0.3s ease;
  z-index:999;
  display:block; /* 👈 importante */
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
}

.floating{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  font-size:30px;
}
</style>
</head>

<body>

<header>Cadastro Moradores Vila Floresta 2</header>
<div id="overlay" onclick="fecharForm()"></div>
<div id="toast">Salvo com sucesso</div>

<div class="container">

<div class="dashboard">
  <div class="card-top"><span>Total</span><b id="total"> R$ 0</b></div>
  <div class="card-top"><span>Pagos</span><b id="pagos"> 0</b></div>
  <div class="card-top"><span>Pendentes</span><b id="pendentes"> 0</b></div>
  <div class="card-top"><span>Em aberto</span><b id="aberto"> R$ 0</b></div>
</div>

<select id="filtroMes"></select>

<canvas id="grafico"></canvas>

<input id="busca" placeholder="Buscar...">
<div id="lista"></div>

</div>

<button class="floating" onclick="abrirForm()">+</button>

<div class="form-box" id="formBox">
<form id="form">
<input type="hidden" id="id">
<input id="nome" placeholder="Nome" required>
<input id="cpf" placeholder="CPF">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="Email">
<input id="endereco" placeholder="Endereço">
<input id="mes" placeholder="03-2026">
<input id="valor" placeholder="Valor">
<select id="status">
<option value="Pago">Pago</option>
<option value="Pendente">Pendente</option>
</select>
<button class="btn">Salvar</button>
<button type="button" class="btn-danger" onclick="cancelar()">Cancelar</button>
</form>
</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbzJo9kKBNoakqcZlSJjMkKy_0a78raI6euNYn5g9uLvBQ4_PNqhnKk0i0K42DTxQty_/exec";
let dadosGlobal=[];
let grafico;
let modoEdicao = false;

/* ================= LOAD ================= */
async function carregar(){
  const res=await fetch(URL);
  const dados=await res.json();
  dadosGlobal=dados.slice(1);

  carregarMeses();
  renderizar();
  calcular();
  atualizarGrafico();
}

/* ================= CANCELAR ================= */
function cancelar(){

  if(!modoEdicao){
    form.reset();
  }

  id.value="";
  modoEdicao = false;

  fecharForm();
}

/* ================= MESES ================= */
function carregarMeses(){
  const select=document.getElementById("filtroMes");

  const meses=[...new Set(dadosGlobal.map(a=>a[6]).filter(Boolean))];

  select.innerHTML='<option value="">Todos</option>';

  meses.forEach(m=>{
    select.innerHTML+=`<option value="${m}">${m}</option>`;
  });
}

/* ================= CALCULO ================= */
function calcular(){

  const mesSel=document.getElementById("filtroMes").value;

  let total=0,pagos=0,pendentes=0,aberto=0;

  dadosGlobal.forEach(a=>{

    if(mesSel && a[6]!==mesSel) return;

    const valor=Number(a[7])||0;
    const status=a[8]||"Pendente";

    if(status==="Pago"){
      total+=valor;
      pagos++;
    }else{
      aberto+=valor;
      pendentes++;
    }
  });

  set("total","R$ "+total.toFixed(2));
  set("pagos",pagos);
  set("pendentes",pendentes);
  set("aberto","R$ "+aberto.toFixed(2));
}

/* ================= UTIL ================= */
function set(id,val){
  const el=document.getElementById(id);
  if(el) el.innerText=val;
}

/* ================= RENDER ================= */
function renderizar(filtro=""){

  const mesSel=document.getElementById("filtroMes").value;

  lista.innerHTML="";

  dadosGlobal
  .filter(a=>{
    const nomeOk=(a[1]||"").toLowerCase().includes(filtro);
    const mesOk=!mesSel || a[6]===mesSel;
    return nomeOk && mesOk;
  })
  .forEach(a=>{

    const status=a[8]||"Pendente";

    const botoes = status!=="Pago"
      ? `<button class="btn" onclick="pagar('${a[0]}')">Pagar</button>`
      : `<button class="btn" onclick="gerarPDF('${a[0]}')">📄 Recibo</button>`;

    const card=document.createElement("div");
    card.className="card "+(status==="Pago"?"pago":"pendente");

    card.innerHTML=`
      <b>${a[1]}</b>
      <div>${a[6]}</div>
      <div>R$ ${a[7]}</div>
      <div>${status}</div>

      <button class="btn-edit" onclick="editar('${a[0]}')">Editar</button>
      ${botoes}
      <button class="btn-danger" onclick="excluir('${a[0]}')">Excluir</button>
    `;

    lista.appendChild(card);
  });
}

function toast(msg="Salvo com sucesso"){
  const t=document.getElementById("toast");
  t.innerText=msg;

  t.style.opacity="1";
  t.style.transform="translateX(-50%) translateY(0)";

  setTimeout(()=>{
    t.style.opacity="0";
    t.style.transform="translateX(-50%) translateY(100px)";
  },2000);
}

/* ================= GRAFICO ================= */
function atualizarGrafico(){

  const mesSel=document.getElementById("filtroMes").value;

  let pago=0,pendente=0;

  dadosGlobal.forEach(a=>{
    if(mesSel && a[6]!==mesSel) return;

    const valor=Number(a[7])||0;
    if(a[8]==="Pago") pago+=valor;
    else pendente+=valor;
  });

  const ctx=document.getElementById("grafico");

  if(grafico) grafico.destroy();

  grafico=new Chart(ctx,{
    type:"doughnut",
    data:{
      labels:["Pago","Pendente"],
      datasets:[{data:[pago,pendente]}]
    }
  });
}

/* ================= PDF ================= */
function gerarPDF(idSel){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();

  const a=dadosGlobal.find(x=>x[0]==idSel);

  const logo=new Image();
  logo.src="logo.png";

  logo.onload=function(){
    doc.addImage(logo,"PNG",150,10,20,20);

    doc.text("Recibo",20,20);
    doc.text("Nome: "+a[1],20,40);
    doc.text("Valor: R$ "+a[7],20,50);

    doc.save("recibo.pdf");
  }
}

/* ================= ACOES ================= */
form.addEventListener("submit",async e=>{
  e.preventDefault();

  const obj={
    acao:id.value?"editar":"adicionar",
    id:id.value,
    nome:nome.value,
    cpf:cpf.value,
    telefone:telefone.value,
    email:email.value,
    endereco:endereco.value,
    mes:mes.value,
    valor:valor.value,
    status: document.getElementById("status").value
  };

  await fetch(URL,{method:"POST",body:JSON.stringify(obj)});

toast("Salvo com sucesso 💰");

  form.reset();
  fecharForm();
  carregar();
});

function editar(idSel){
  const a=dadosGlobal.find(x=>x[0]==idSel);

  modoEdicao=true;

  id.value=a[0];
  nome.value=a[1];
  cpf.value=a[2]||"";
  telefone.value=a[3]||"";
  email.value=a[4]||"";
  endereco.value=a[5]||"";
  mes.value=a[6]||"";
  valor.value=a[7]||"";
  document.getElementById("status").value = a[8] || "Pendente";

  abrirForm(false);
}

async function pagar(idSel){
  const a=dadosGlobal.find(x=>x[0]==idSel);

  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      acao:"editar",
      id:a[0],
      nome:a[1],
      cpf:a[2],
      telefone:a[3],
      email:a[4],
      endereco:a[5],
      mes:a[6],
      valor:a[7],
      status:"Pago"
    })
  });

  carregar();
}

async function excluir(idSel){
  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({acao:"excluir",id:idSel})
  });
  carregar();
}

/* ================= UI ================= */
busca.addEventListener("input",e=>{
  renderizar(e.target.value.toLowerCase());
});

filtroMes.addEventListener("change",()=>{
  renderizar(busca.value.toLowerCase());
  calcular();
  atualizarGrafico();
});

function abrirForm(novo=true){

  if(novo){
    form.reset();
    id.value="";
    modoEdicao=false;
  }

  overlay.style.display="block";

  // força render antes da animação
  formBox.style.bottom="-100%";

  setTimeout(()=>{
    formBox.style.bottom="0";
  },10);
}

function fecharForm(){

  formBox.style.bottom="-100%";

  setTimeout(()=>{
    overlay.style.display="none";
  },300);
}

carregar();
</script>

</body>
</html>
