<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Associados</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}

body{margin:0;background:#eef2f7}

/* LAYOUT */
.app{display:flex}

/* SIDEBAR */
.sidebar{
  width:70px;
  background:#1e293b;
  color:#fff;
  height:100vh;
  transition:.3s;
  overflow:hidden;
}
.sidebar:hover{width:200px}

.menu-item{
  padding:15px;
  cursor:pointer;
  display:flex;
  gap:10px;
}
.menu-item span{opacity:0;transition:.3s}
.sidebar:hover span{opacity:1}

/* CONTENT */
.content{flex:1;padding:15px}

.tela{display:none}
.tela.ativa{display:block}

/* DASHBOARD */
.dashboard{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.card-top{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

/* LISTA */
.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}
.card.pago{border-left:5px solid green}
.card.pendente{border-left:5px solid red}

.actions{margin-top:8px;display:flex;gap:5px}

/* BUTTON */
button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}
.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:20px;
  border-radius:20px 20px 0 0;
  z-index:999;
  max-height:80vh;
  overflow:auto;
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="menu-item" onclick="abrirTela('dashboard')">🏠 <span>Dashboard</span></div>
  <div class="menu-item" onclick="abrirTela('lista')">👥 <span>Associados</span></div>
  <div class="menu-item" onclick="abrirTela('grafico')">📊 <span>Gráfico</span></div>
  <div class="menu-item" onclick="verRelatorio()">📄 <span>Relatório</span></div>
  <div class="menu-item" onclick="verDevedores()">⚠️ <span>Devedores</span></div>
</div>

<!-- CONTENT -->
<div class="content">

<header><h2>Vila Floresta 2</h2></header>

<!-- DASHBOARD -->
<div id="tela-dashboard" class="tela">
  <div class="dashboard">
    <div class="card-top"><span>Total</span><b id="total">R$ 0</b></div>
    <div class="card-top"><span>Recebido</span><b id="pagos">0</b></div>
    <div class="card-top"><span>Pendentes</span><b id="pendentes">0</b></div>
    <div class="card-top"><span>Em aberto</span><b id="aberto">R$ 0</b></div>
  </div>
</div>

<!-- LISTA -->
<div id="tela-lista" class="tela">
  <input id="busca" placeholder="Buscar...">
  <div id="lista"></div>
</div>

<!-- GRAFICO -->
<div id="tela-grafico" class="tela">
  <canvas id="grafico"></canvas>
</div>

</div>
</div>

<!-- MODAL -->
<div id="modalRelatorio" class="modal"></div>

<script>

/* CONFIG */
const API_URL = "https://script.google.com/macros/s/AKfycbzJo9kKBNoakqcZlSJjMkKy_0a78raI6euNYn5g9uLvBQ4_PNqhnKk0i0K42DTxQty_/exec";
let dadosGlobal=[];
let grafico;

/* NAV */
function abrirTela(nome){
  document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
  document.getElementById("tela-"+nome).classList.add("ativa");

  if(nome==="grafico") atualizarGrafico();
}

/* LOAD */
async function carregar(){
  const res = await fetch(API_URL);
  const dados = await res.json();
  dadosGlobal = dados.slice(1);

  renderizar();
  calcular();
  backupAutomatico();
}

/* DASH */
function calcular(){
  let total=0,pagos=0,pendentes=0,aberto=0;

  dadosGlobal.forEach(a=>{
    const v=Number(a[7])||0;
    if(a[8]==="Pago"){total+=v;pagos++}
    else{aberto+=v;pendentes++}
  });

  set("total","R$ "+total.toFixed(2));
  set("pagos",pagos);
  set("pendentes",pendentes);
  set("aberto","R$ "+aberto.toFixed(2));
}

function set(id,val){
  const el=document.getElementById(id);
  if(el) el.innerText=val;
}

/* LISTA */
function renderizar(f=""){
  lista.innerHTML="";

  dadosGlobal.filter(a=>a[1].toLowerCase().includes(f))
  .forEach(a=>{

    const status=a[8]||"Pendente";

    const card=document.createElement("div");
    card.className="card "+(status==="Pago"?"pago":"pendente");

    card.innerHTML=`
      <b>${a[1]}</b>
      <div>${a[6]} - R$ ${a[7]}</div>

      <div class="actions">
        <button class="btn-edit" onclick="event.stopPropagation();editar('${a[0]}')">Editar</button>

        ${
          status!=="Pago"
          ? `<button class="btn" onclick="event.stopPropagation();pagar('${a[0]}')">Pagar</button>`
          : `<button class="btn" onclick="event.stopPropagation();gerarPDF('${a[0]}')">📄</button>`
        }

        <button class="btn" onclick="event.stopPropagation();enviarWhatsApp('${a[0]}')">📲</button>
        <button class="btn-danger" onclick="event.stopPropagation();excluir('${a[0]}')">X</button>
      </div>
    `;

    lista.appendChild(card);
  });
}

/* GRAFICO */
function atualizarGrafico(){
  let p=0,d=0;

  dadosGlobal.forEach(a=>{
    const v=Number(a[7])||0;
    if(a[8]==="Pago") p+=v;
    else d+=v;
  });

  const ctx=document.getElementById("grafico");

  if(grafico) grafico.destroy();

  grafico=new Chart(ctx,{
    type:"doughnut",
    data:{labels:["Pago","Pendente"],datasets:[{data:[p,d]}]},
    options:{cutout:"70%"}
  });
}

/* WHATS */
function enviarWhatsApp(idSel){
  const a=dadosGlobal.find(x=>x[0]==idSel);
  let num=(a[3]||"").replace(/\D/g,"");
  if(!num) return alert("Sem telefone");

  if(!num.startsWith("55")) num="55"+num;

  const msg=`Olá ${a[1]}%0AValor: R$ ${a[7]}`;
  window.open(`https://wa.me/${num}?text=${msg}`);
}

/* PDF */
function gerarPDF(idSel){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"landscape"});

  const a=dadosGlobal.find(x=>x[0]==idSel);

  doc.text("RECIBO",20,20);
  doc.text(a[1],20,40);
  doc.text("R$ "+a[7],20,50);

  doc.save("recibo.pdf");
}

/* RELATORIO */
function verRelatorio(){
  let html="<h3>Relatório</h3>";

  dadosGlobal.forEach(a=>{
    html+=`<div>${a[1]} - R$ ${a[7]}</div>`;
  });

  html+=`<button onclick="gerarRelatorio()" class="btn">PDF</button>
  <button onclick="fecharRelatorio()" class="btn-danger">Fechar</button>`;

  modalRelatorio.innerHTML=html;
  modalRelatorio.style.display="block";
}

function verDevedores(){
  let html="<h3>Devedores</h3>";

  dadosGlobal.filter(a=>a[8]!=="Pago")
  .forEach(a=>{
    html+=`<div>${a[1]} - R$ ${a[7]}</div>`;
  });

  html+=`<button onclick="gerarDevedores()" class="btn">PDF</button>
  <button onclick="fecharRelatorio()" class="btn-danger">Fechar</button>`;

  modalRelatorio.innerHTML=html;
  modalRelatorio.style.display="block";
}

function fecharRelatorio(){
  modalRelatorio.style.display="none";
}

/* BACKUP */
function backupAutomatico(){
  const hoje=new Date().toISOString().slice(0,10);
  if(localStorage.getItem("backup_data")===hoje) return;

  localStorage.setItem("backup_associados",JSON.stringify(dadosGlobal));
  localStorage.setItem("backup_data",hoje);
}

/* INIT */
busca.addEventListener("input",e=>renderizar(e.target.value.toLowerCase()));

abrirTela("dashboard");
carregar();

</script>

</body>
</html>
