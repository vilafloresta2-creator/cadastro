/* ================= NAVEGAÇÃO ================= */
function ir(tela){
  telaAtual = tela;

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  document.getElementById("btn_"+tela).classList.add("active");

  render();
}


/* ================= LISTAS ================= */

/* ================= LISTA DESPESAS FIXAS ================= */
function listarFixas(){

  let html = "";

  fixas.forEach(f => {

    html += `
      <div class="card"
        style="display:flex;
        justify-content:space-between;
        align-items:center;">

        <div>
          <b>${f[1]}</b><br>

          ${f[2]}<br>

          Dia ${f[4]}<br>

          R$ ${Number(f[3]).toFixed(2)}
        </div>

      </div>
    `;
  });

  document.getElementById("listaFixas")
    .innerHTML = html;
}

/* ================= LISTAR CAIXA ================= */
function listarCaixa(){

  let entradas = 0;
  let saidas = 0;

  let html = "";

  caixa.slice().reverse().forEach(c => {

    const tipo = c[2];
    const categoria = c[3];
    const descricao = c[4];
    const valor = Number(c[5]);
    const data = formatarData(c[1]);

    if(tipo === "Entrada"){
      entradas += valor;
    }else{
      saidas += valor;
    }

    html += `

      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">

        <div>

          <div style="font-size:16px;font-weight:600;">
            ${descricao}
          </div>

          <div style="font-size:12px;opacity:0.7;">
            ${categoria} • ${data}
          </div>

        </div>

        <div style="display:flex;align-items:center;gap:8px;">

          <div style="
            font-weight:bold;
            color:${tipo === "Entrada" ? "#22c55e" : "#ef4444"};
          ">
            ${tipo === "Entrada" ? "+" : "-"}
            R$ ${valor.toFixed(2)}
          </div>

          <button class="btn-edit btn-icon"
            onclick="editarCaixa('${c[0]}')">
            ✏️
          </button>

          <button class="btn-cancelar btn-icon"
            onclick="excluirCaixa('${c[0]}')">
            🗑️
          </button>

        </div>

      </div>

    `;

  });

  document.getElementById("listaCaixa").innerHTML = html;

  document.getElementById("totalEntradas").innerText =
    "R$ " + entradas.toFixed(2);

  document.getElementById("totalSaidas").innerText =
    "R$ " + saidas.toFixed(2);

  document.getElementById("saldoFinal").innerText =
    "R$ " + (entradas - saidas).toFixed(2);
}

/* ================= LISTAR RECIBOS ================= */
function listarRecibos(){

  const buscaInput = document.getElementById("buscaRecibo");
  const busca = (buscaInput?.value || "").toLowerCase();

  const filtroMesEl = document.getElementById("filtroMesRecibo");
  const mes = filtroMesEl ? filtroMesEl.value : "";

  let lista = [...recibos];

  if(busca){
    lista = lista.filter(r => String(r[2]).toLowerCase().includes(busca));
  }

  if(mes){
    lista = lista.filter(r => r[4] == mes);
  }

  let html = "";

  [...lista].reverse().forEach(r => {

    const numero = r[1];
    const nome = r[2];
    const valor = Number(r[5]).toFixed(2);
    const data = formatarData(r[6]);

    html += `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        
        <div>
          <div style="font-size:16px;font-weight:600;">
            ${nome}
          </div>

          <div style="font-size:12px;opacity:0.7;">
            ${numero} • ${data}
          </div>

          <div style="margin-top:5px;">
            R$ ${valor}
          </div>
        </div>

        <button 
          style="font-size:12px;padding:6px 10px;"
          onclick="reimprimir('${numero}')"
          class="btn-recibo">
          🧾 Reimprimir
        </button>

      </div>
    `;
  });

  document.getElementById("listaRecibos").innerHTML = html;
}

/* ================= LISTAR ASSOCIADOS ================= */
function listarAssociados(){

  const busca = document.getElementById("busca")
    .value
    .toLowerCase();

  let lista = associados.filter(a =>
    String(a[1] || "").toLowerCase().includes(busca)
  );

  let html = "";

  lista.forEach(a=>{

    const status = statusAssociado(a[2]);

    const ativo =
      (a[7] || "Ativo") === "Ativo";

    html += `
      <div class="card" style="
        display:flex;
        justify-content:space-between;
        align-items:center;
      ">

        <div>

          <div style="
            font-size:18px;
            font-weight:600;
          ">
            ${a[1]}
          </div>

          <div style="
            font-size:13px;
            color:${
              !ativo
                ? "#9ca3af"
                : status=="Devedor"
                  ? "#ef4444"
                  : "#22c55e"
            };
          ">

            ${
              !ativo
                ? "⚫ Inativo"
                : status=="Devedor"
                  ? "🔴 Devedor"
                  : "🟢 Regular"
            }

          </div>

        </div>

        <div style="display:flex;gap:6px;">
          <button class="btn-edit btn-icon"
            onclick="editar('${a[0]}')">
            ✏️
          </button>

          <button class="btn-cancelar btn-icon"
            onclick="excluir('${a[0]}')">
            🗑️
          </button>
        </div>

      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

/* ================= LISTAR DEVEDORES================= */
function listarDevedores(){

  const busca = (document.getElementById("buscaDevedor")?.value || "").toLowerCase();
  const mes = document.getElementById("filtroMesDevedor")?.value || "";

  let lista = cobrancas.filter(c => c[5] === "Pendente");

  if(busca){
    lista = lista.filter(c => String(c[1]).toLowerCase().includes(busca));
  }

  if(mes){
    lista = lista.filter(c => c[3] == mes);
  }

  let total = 0;
  let html = "";

  if(lista.length === 0){
    html = `<div class="card">Nenhum devedor 🎉</div>`;
  }

  lista.sort((a,b)=>b[4]-a[4]).forEach(c => {

    const nome = c[1];
    const mes = formatarMes(c[3]);
    const valor = Number(c[4]);

    total += valor;

    html += `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        
        <div>
          <div style="font-size:16px;font-weight:600;">
            ${nome}
          </div>

          <div style="font-size:12px;color:#ef4444;">
            ${mes} • Em aberto
          </div>

          <div style="margin-top:5px;">
            R$ ${valor.toFixed(2)}
          </div>
        </div>

        <button class="btn-light" 
          style="font-size:12px;padding:6px 12px;"
          onclick="ir('cobrancas')">
          Ver
        </button>

      </div>
    `;
  });

  // 🔥 ATUALIZA TOTAL NO TOPO
  const totalEl = document.getElementById("totalDivida");
  if(totalEl){
    totalEl.innerText = "R$ " + total.toFixed(2);
  }

  document.getElementById("listaDevedores").innerHTML = html;
}

/* ================= LISTAR ================= */
function listar(){

  const mes = document.getElementById("filtroMes")?.value || "";

  let lista = cobrancas;

  if(mes){
    lista = lista.filter(c=>c[3]==mes);
  }

  let html = "";

  lista.forEach(c=>{

    html += `
      <div class="card">
        <b>${c[1]}</b><br>
        ${formatarMes(c[3])}<br>
        <b>${c[5]}</b><br>

        ${c[5]=="Pendente" ? 
          `<button class="btn-light" onclick="pagar('${c[0]}')">Pagar</button>` 
        : ""}

        ${c[5]=="Pago" ? `
          <button class="btn-recibo"
            style="margin-top:8px;"
            onclick="reimprimir('${c[7] || ""}')">
            🧾 Reimprimir
          </button>
        ` : ""}
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

/* ================= LISTAR BACKUPS ================= */
function listarBackups(){

  let html = "";

  backups.slice().reverse().forEach(b => {

    const data = formatarData(b[0]);
    const nome = b[1];
    const link = b[2];

    html += `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        
        <div>
          <b>${nome}</b><br>
          <small>${data}</small>
        </div>

        <div style="display:flex;gap:6px;">
          <button class="btn" onclick="window.open('${link}')">Abrir</button>
          <button class="btn-light" onclick="restaurarBackup('${link}')">Restaurar</button>
        </div>

      </div>
    `;
  });

  document.getElementById("listaBackups").innerHTML = html;
}

/* ================= EDITAR ASSOCIADO ================= */
function editar(id){
  console.log("EDITANDO ID:", id); // debug

  const a = associados.find(x=>x[0]==id);

  if(!a){
    alert("Associado não encontrado");
    return;
  }

  editandoId = id;

  m_nome.value = a[1];
  m_cpf.value = maskCPF(String(a[2]).padStart(11,"0"));
  m_tel.value = a[3];
  m_email.value = a[4] || "";
  m_endereco.value = a[5] || "";
  m_mensal.value = a[6];
  m_status.value = a[7] || "Ativo";

  modalTitulo.innerText = "Editar Associado";

  abrirModal();
}

/* ==================== GERAR RELATORIOS ================*/
function gerarRelatorioMensal(){

  const mes =
    document.getElementById("mesRelatorio").value;

  if(!mes){
    alert("Informe o mês");
    return;
  }

  let entradas = 0;
  let saidas = 0;

  let categorias = {};

  caixa.forEach(c => {

    if(!c[1]) return;

    const d = new Date(c[1]);

    const mesLinha =
      String(d.getMonth()+1).padStart(2,"0")
      + "-"
      + d.getFullYear();

    if(mesLinha !== mes){
      return;
    }

    const tipo =
      String(c[2]).trim();

    const categoria =
      String(c[3]).trim();

    const valor =
      Number(c[5]) || 0;

    if(tipo === "Entrada"){
      entradas += valor;
    }

    if(
      tipo === "Saída"
      || tipo === "Saida"
    ){

      saidas += valor;

      if(!categorias[categoria]){
        categorias[categoria] = 0;
      }

      categorias[categoria] += valor;
    }

  });

  let inadimplencia = 0;

  cobrancas.forEach(c => {

    if(
      String(c[3]).trim() === mes
      && String(c[5]).trim() === "Pendente"
    ){

      inadimplencia += Number(c[4]) || 0;
    }

  });

  const saldo = entradas - saidas;

  let htmlCategorias = "";

  Object.keys(categorias).forEach(cat => {

    htmlCategorias += `
      <div style="
        display:flex;
        justify-content:space-between;
        margin-top:5px;
      ">
        <span>${cat}</span>
        <b>R$ ${categorias[cat].toFixed(2)}</b>
      </div>
    `;
  });

  document.getElementById("resultadoRelatorio")
    .innerHTML = `

    <div class="card" style="margin-top:15px;">

      <h2>
        Relatório ${mes}
      </h2>

      <hr>

      <p>
        <b>Entradas:</b>
        R$ ${entradas.toFixed(2)}
      </p>

      <p>
        <b>Saídas:</b>
        R$ ${saidas.toFixed(2)}
      </p>

      <p>
        <b>Saldo Final:</b>
        R$ ${saldo.toFixed(2)}
      </p>

      <p>
        <b>Inadimplência:</b>
        R$ ${inadimplencia.toFixed(2)}
      </p>

      <hr>

      <h3>Despesas por Categoria</h3>

      ${htmlCategorias || "Nenhuma despesa"}

    </div>

  `;
}

function gerarHTMLRecibo(dados){

    <div style="text-align:center;">

      <b style="font-size:18px;">Vila Floresta 2</b>
    </div>

    <p><b>Nº:</b> ${dados.numero}</p>
    <p><b>Nome:</b> ${dados.nome}</p>
    <p><b>CPF:</b> ${dados.cpf}</p>
    <p><b>Mês:</b> ${dados.mes}</p>
    <p><b>Valor:</b> R$ ${Number(dados.valor).toFixed(2)}</p>

    <hr>

    <p style="text-align:center;">
      Recebemos o valor acima referente à mensalidade.
    </p>

    <p style="text-align:center; margin-top:20px;">
      ${new Date().toLocaleDateString("pt-BR")}
    </p>

  </div>
  `;
}

function gerarRecibo(c, numero){

  const nome = c[1];
  const cpf = c[2];
  const mes = formatarMes(c[3]);
  const valor = Number(c[4]).toFixed(2);
  const data = new Date().toLocaleDateString("pt-BR");

  const html = `
    <html>
    <head>
      <title>Recibo</title>
      <style>
        body{
          font-family:Arial;
          padding:30px;
          text-align:center;
        }
        .box{
          border:2px solid #000;
          padding:20px;
          border-radius:10px;
        }
        h2{
          margin-bottom:10px;
        }
        .numero{
          font-size:14px;
          margin-bottom:15px;
        }
        .linha{
          margin:10px 0;
          font-size:16px;
        }
      </style>
    </head>
    <body>

      <div class="box">

        <h2>RECIBO DE PAGAMENTO</h2>

        <div class="numero"><b>Nº:</b> ${numero}</div>

        <img src="https://github.com/vilafloresta2-creator/cadastro/blob/main/logo.png?raw=true" 
             style="height:80px;margin-bottom:15px;"><br>

        <div class="linha"><b>Recebemos de:</b> ${nome}</div>
        <div class="linha"><b>CPF:</b> ${cpf}</div>
        <div class="linha"><b>Referente:</b> ${mes}</div>
        <div class="linha"><b>Valor:</b> R$ ${valor}</div>
        <div class="linha"><b>Data:</b> ${data}</div>

        <br><br>

        ___________________________<br>
        Assinatura

      </div>

      <scr` + `ipt>
        window.onload = function(){
          window.print();
        }
      </scr` + `ipt>

    </body>
    </html>
  `;

  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
}

function reimprimir(numero){

  if(!numero){
    alert("Recibo sem número");
    return;
  }

  const rec = recibos.find(r => String(r[1]).trim() === String(numero).trim());

  if(!rec){
    alert("Recibo não encontrado");
    return;
  }

  const nome = rec[2];
  const cpf = String(rec[3]).padStart(11,"0"); // 🔥 garante zero
  const mes = rec[4];
  const valor = Number(rec[5]).toFixed(2);

  gerarRecibo([0, nome, cpf, mes, valor], numero);
}

function reimprimirPorCobranca(id){

  const c = cobrancas.find(x => String(x[0]) === String(id));

  if(!c){
    alert("Cobrança não encontrada");
    return;
  }

  const numero = c[7]; // coluna onde salvou o recibo

  if(!numero){
    alert("Recibo não gerado ainda");
    return;
  }

  reimprimir(numero);
}
