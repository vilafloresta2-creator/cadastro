<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vila Floresta 2 - Profissional</title>

<style>
body{font-family:Arial;margin:0;background:#eef2f7}
header{background:#1e293b;color:#fff;padding:15px;text-align:center}
.container{padding:15px;max-width:900px;margin:auto}

.card{background:#fff;padding:15px;border-radius:12px;margin-top:10px}
button{border:none;padding:8px 12px;margin:3px;border-radius:6px;color:#fff;cursor:pointer}
.btn{background:#2563eb}
.btn-edit{background:#f59e0b}
.btn-danger{background:#ef4444}
.btn-light{background:#e5e7eb;color:#111}

input{width:100%;padding:10px;margin:5px 0}

.menu-box{
  position:fixed;top:0;left:0;width:250px;height:100%;
  background:#111827;color:#fff;padding:20px;
  transform:translateX(-100%);transition:0.3s;
}
.menu-box div{padding:12px;cursor:pointer}
.menu-box div:hover{background:#374151}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4)}
.form-box{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:15px;border-radius:20px 20px 0 0}
</style>
</head>

<body>

<header>Vila Floresta 2 - Gestão</header>

<div class="container">
  <button onclick="abrirMenu()">☰ Menu</button>
  <div id="lista"></div>
</div>

<div id="menu" class="menu-box">
  <h3>Menu</h3>
  <div onclick="verCobrancas()">💰 Cobranças</div>
  <div onclick="verAssociados()">👤 Associados</div>
</div>

<div id="overlay" class="overlay" onclick="fecharTudo()"></div>

<div id="formBox" class="form-box">
  <h3 id="tituloForm"></h3>
  <form id="form">
    <input type="hidden" id="id">
    <input id="nome" placeholder="Nome" required>
    <input id="cpf" placeholder="CPF">
    <input id="telefone" placeholder="Telefone">
    <input id="mensalidade" placeholder="Mensalidade">
    <button class="btn">Salvar</button>
    <button type="button" class="btn-light" onclick="fecharTudo()">Cancelar</button>
  </form>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxjzyKCFHk6WZXnShm5WhYoLjtVFcyYzWioo3v9cpFi7bRoAERxrH_mAbIVlsaWGyrG/exec";

let associados = [];
let cobrancas = [];

async function carregar(){

  // 1. pega dados
  let res = await fetch(API_URL);
  let data = await res.json();

  associados = data.associados.slice(1);
  cobrancas = data.cobrancas.slice(1);

  // 2. gera cobranças automáticas
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({acao:"gerar_cobrancas"})
  });

  // 3. recarrega
  res = await fetch(API_URL);
  data = await res.json();

  associados = data.associados.slice(1);
  cobrancas = data.cobrancas.slice(1);

  // 4. renderiza
  verCobrancas();
}

function abrirMenu(){
  menu.style.transform="translateX(0)";
  overlay.style.display="block";
}

function fecharTudo(){
  menu.style.transform="translateX(-100%)";
  overlay.style.display="none";
  formBox.style.display="none";
}

/* ================= ASSOCIADOS ================= */
function verAssociados(){
  lista.innerHTML = "<button class='btn' onclick='novoAssociado()'>+ Novo</button>";

  associados.forEach(a=>{
    lista.innerHTML += `
      <div class="card">
        <b>${a[1]}</b><br>
        CPF: ${a[2]}<br>
        <button class="btn-edit" onclick="editarAssociado('${a[0]}')">Editar</button>
      </div>
    `;
  });
}

function novoAssociado(){
  tituloForm.innerText = "Novo Associado";
  formBox.style.display="block";
  overlay.style.display="block";
}

function editarAssociado(idSel){
  const a = associados.find(x=>x[0]==idSel);
  id.value = a[0];
  nome.value = a[1];
  cpf.value = a[2];
  telefone.value = a[3];
  mensalidade.value = a[4];

  tituloForm.innerText = "Editar Associado";
  formBox.style.display="block";
  overlay.style.display="block";
}

/* ================= COBRANÇAS ================= */
function verCobrancas(){
  lista.innerHTML = "";

  cobrancas.forEach(c=>{
    lista.innerHTML += `
      <div class="card">
        <b>${c[1]}</b><br>
        ${c[3]} - R$ ${c[4]}<br>
        <span>${c[5]}</span>
      </div>
    `;
  });
}

/* ================= SUBMIT ================= */
form.addEventListener("submit", async e=>{
  e.preventDefault();

  const obj = {
    acao:"salvar_associado",
    id:id.value,
    nome:nome.value,
    cpf:cpf.value,
    telefone:telefone.value,
    mensalidade:mensalidade.value
  };

  await fetch(API_URL,{method:"POST",body:JSON.stringify(obj)});

  fecharTudo();
  carregar();
});

carregar();
</script>

</body>
</html>
